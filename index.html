<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Steamer - Maryland Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Auth Screen -->
  <div id="auth-screen" class="screen">
    <div class="auth-box">
      <h1>🦀 The Steamer</h1>
      <p>Maryland's finest chatroom</p>
      
      <form id="auth-form">
        <input type="email" id="email" placeholder="Email address" required>
        <input type="password" id="password" placeholder="Password" required>
        
        <div class="auth-buttons">
          <button type="submit" id="login-btn">Log In</button>
          <button type="button" id="signup-btn" class="secondary">Create Account</button>
        </div>
        <p id="auth-error" class="error-msg"></p>
      </form>
    </div>
  </div>

  <!-- Chat Screen -->
  <div id="chat-screen" class="screen hidden">
    <div class="sidebar">
      <h2>🦀 The Steamer</h2>
      <div class="channels">
        <div class="channel active"># blue-crabs-general</div>
        <div class="channel"># ravens-flock</div>
        <div class="channel"># orioles-magic</div>
      </div>
      <div class="user-panel">
        <span id="current-user">User</span>
        <button id="logout-btn">Logout</button>
      </div>
    </div>
    
    <div class="chat-area">
      <div class="chat-header">
        <h3># blue-crabs-general</h3>
      </div>
      
      <div id="messages-container" class="messages-container">
        <!-- Messages load here -->
      </div>
      
      <form id="message-form" class="message-input-area">
        <input type="text" id="message-input" placeholder="Message #blue-crabs-general..." required autocomplete="off">
        <button type="submit">Send</button>
      </form>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
