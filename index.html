<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Old Bay Huffers</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Auth Screen -->
  <div id="auth-screen" class="screen">
    <div class="auth-box">
      <h1>Old Bay Huffers</h1>
      <p>Maryland's finest chatroom</p>
      
      <form id="auth-form">
        <div id="login-fields">
          <input type="text" id="username" placeholder="Username" required autocomplete="off">
          <input type="password" id="password" placeholder="Password" required>
        </div>
        
        <div id="age-group" class="hidden">
          <label style="color: var(--ob-blue); font-weight: bold; margin-bottom: 5px; display:block;">Select your age:</label>
          <select id="age-select">
            <option value="13-14">13-14</option>
            <option value="15-16">15-16</option>
            <option value="17-18">17-18</option>
            <option value="19-20">19-20</option>
            <option value="21+">21+</option>
          </select>
        </div>
        
        <div class="auth-buttons">
          <button type="button" id="login-btn">Log In</button>
          <button type="button" id="signup-btn" class="secondary">Create Account</button>
        </div>
        <p id="auth-error" class="error-msg"></p>
      </form>
    </div>
  </div>

  <!-- Profile Edit Modal -->
  <div id="profile-modal" class="modal hidden">
    <div class="modal-content">
      <h3 style="color: var(--ob-blue); margin-bottom: 10px;">Edit Profile</h3>
      <input type="text" id="display-name-input" placeholder="Display Name (Optional)" maxlength="20">
      <textarea id="bio-input" placeholder="Write a short bio..." rows="3" maxlength="100"></textarea>
      <div class="auth-buttons" style="margin-top: 10px;">
        <button id="save-profile-btn">Save</button>
        <button id="cancel-profile-btn" class="secondary">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Chat Screen -->
  <div id="chat-screen" class="screen hidden">
    <div class="sidebar">
      <div>
        <h2>Old Bay Huffers</h2>
        <div class="channels">
          <div class="channel active" data-channel="main"># main-chat</div>
          <div class="channel" data-channel="staff"># staff-chat 🛡️</div>
        </div>
      </div>
      
      <div class="user-panel">
        <div class="user-profile-wrapper">
          <label for="pfp-upload" class="pfp-label" title="Click to change profile picture">
            <img id="current-pfp" src="" alt="Profile">
            <div class="pfp-overlay">Edit</div>
          </label>
          <input type="file" id="pfp-upload" accept="image/*" class="hidden">
          <span id="current-user">User</span>
        </div>
        <div style="display: flex; gap: 5px;">
          <button id="edit-profile-btn" style="background: var(--ob-yellow); color: var(--ob-blue); flex: 1; padding: 6px; font-size: 12px;">⚙️ Profile</button>
          <button id="logout-btn" style="flex: 1; padding: 6px; font-size: 12px;">Logout</button>
        </div>
      </div>
    </div>
    
    <div class="chat-area">
      <div class="chat-header">
        <h3 id="current-channel-title"># main-chat</h3>
      </div>
      
      <div id="messages-container" class="messages-container">
        <!-- Messages load here -->
      </div>
      
      <div class="input-container">
        <!-- Reply Banner -->
        <div id="reply-banner" class="hidden">
          <span>Replying to <strong id="reply-to-name"></strong>: <span id="reply-to-text"></span></span>
          <button type="button" id="cancel-reply-btn">X</button>
        </div>

        <div id="typing-indicator" class="typing-indicator hidden">Someone is typing...</div>
        
        <div id="file-preview" class="hidden">
          <span id="file-preview-name">filename.jpg</span>
          <button type="button" id="remove-file-btn">X</button>
        </div>
        
        <form id="message-form" class="message-input-area">
          <label for="file-upload" class="file-label" title="Attach a file (Max 5MB)">+</label>
          <input type="file" id="file-upload" class="hidden">
          <input type="text" id="message-input" placeholder="Message the chat..." autocomplete="off">
          <button type="submit">Send</button>
        </form>
        <p id="chat-error" class="error-msg hidden"></p>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
